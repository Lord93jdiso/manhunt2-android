plugins {
     id 'com.android.application'
}

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "org.mh2.port"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "0.1-bringup"
        externalNativeBuild {
            cmake {
                def cmakeArgs = [
                    "-DANDROID_PLATFORM=android-24",
                    "-DANDROID_STL=c++_static",
                    // NDK-тулчейн ре-рутит поиск пакетов: без BOTH find_package(SDL3) не виден
                    "-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH",
                ]
                def sdl3Dir = System.getenv('SDL3_DIR')
                if (sdl3Dir != null && !sdl3Dir.isEmpty()) {
                    cmakeArgs += "-DSDL3_DIR=${sdl3Dir}"
                }
                arguments = cmakeArgs
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
