name: build-librw-android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-librw-android.yml"
      - "tools/ci_patch_librw_android.py"

jobs:
  librw-android-arm64:
    name: librw + SDL3 (Android arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Определить NDK
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          test -n "$NDK_DIR" && test -d "$NDK_DIR"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"

      - name: Клон и сборка SDL3 (Android arm64)
        run: |
          git clone --depth 1 --branch release-3.2.x https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL" \
            || git clone --depth 1 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/sdl-build" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl-build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/sdl-build"

      - name: Клон librw + Android-патч
        run: |
          git clone --depth 1 https://github.com/aap/librw.git "$RUNNER_TEMP/librw"
          python3 tools/ci_patch_librw_android.py "$RUNNER_TEMP/librw"

      - name: Сборка librw (CMake + NDK, GL3=GLES3, SDL3)
        run: |
          cmake -S "$RUNNER_TEMP/librw" -B build-librw \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" \
            -DLIBRW_PLATFORM=GL3 \
            -DLIBRW_GL3_GFXLIB=SDL3 \
            -DLIBRW_TOOLS=OFF \
            -DLIBRW_INSTALL=OFF \
            -DLIBRW_EXAMPLES=OFF
          cmake --build build-librw -j"$(nproc)"

      - name: Собрать артефакты в dist/
        run: |
          mkdir -p dist
          cp -v build-librw/src/*.a dist/ 2>/dev/null || true
          cp -v build-librw/src/*.so dist/ 2>/dev/null || true
          cp -v "$RUNNER_TEMP/sdl3/lib"/libSDL3.so dist/ 2>/dev/null || true
          ls -la dist/

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: librw-android-arm64
          path: dist/
          if-no-files-found: error
